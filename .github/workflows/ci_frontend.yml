name: Frontend CI/CD - Build and Push

on:
  push:
    branches: [ main ] # Trigger on a push to the main branch
    paths:
      - 'frontend/**' # IMPORTANT: Only run if files in the 'frontend/' directory change

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necessary to push to GHCR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Uses the secret you created on GitHub 
          password: ${{ secrets.CR_PAT }} 

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend # The build context is set to the frontend folder
          push: true
          # The tag format will be: ghcr.io/YOUR_GITHUB_USER/YOUR_REPO_NAME/frontend:latest
          tags: ghcr.io/${{ github.repository }}/frontend:latest 
          cache-from: type=gha
          cache-to: type=gha,mode=max