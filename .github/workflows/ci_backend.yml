name: Backend CI/CD - Build and Push

on:
  push:
    branches: [ main ] # Trigger on a push to the main branch
    # paths:
    #   - 'backend/**'  <-- Is line ko ya toh hata denge, ya comment kar denge (# laga kar)
  
  # NEW: Isse aap GitHub UI se manually run kar sakte hain
  workflow_dispatch: 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necessary to push to GHCR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Uses the secret you created on GitHub 
          password: ${{ secrets.CR_PAT }} 

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend 
          push: true
          tags: ghcr.io/${{ github.repository.toLowerCase() }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
